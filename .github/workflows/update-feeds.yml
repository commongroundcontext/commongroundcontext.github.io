name: Update Feeds

on:
  # Every Sunday at 14:00 UTC — adjust to suit when your post goes live.
  # Use https://crontab.guru to experiment with cron expressions.
  schedule:
    - cron: '0 14 * * 0'

  # Also runnable on-demand from the Actions tab (useful for testing).
  workflow_dispatch:

jobs:
  update-feeds:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to commit & push feed files

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run feed updater
        run: python scripts/update_feeds.py

      - name: Commit & push if feeds changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.json feed.xml
          if ! git diff --staged --quiet; then
            git commit -m "feed: add post $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No new post found — nothing to commit."
          fi
